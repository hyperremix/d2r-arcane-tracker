name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job names `lint`, `format`, `type` and `test` are the required status-check contexts of the
# `Main` branch ruleset; renaming or removing one blocks every pull request from merging.
jobs:
  # `bun run check` is a superset of `bun run lint` (it also checks formatting and import sorting)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome check (lint, format and import sorting)
        run: bun run check

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome format
        run: bun run format

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript type check
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Vitest Tests
          path: coverage/test-results.xml
          reporter: java-junit

      - name: Publish coverage reports
        uses: codecov/codecov-action@v5
        if: ${{ success() }}
        with:
          files: coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:run

  build-windows:
    runs-on: windows-latest
    env:
      # Smoke build only: no code signing and nothing is published
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build renderer and main bundles
        run: bunx vite build

      - name: Package unpacked Windows app
        run: bunx electron-builder --win --dir --publish never

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, format, type, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
