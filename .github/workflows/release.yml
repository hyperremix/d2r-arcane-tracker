name: Release

# Builds the Windows installer and the Linux AppImage for a version tag (pushed by
# `bun run version:*`) and uploads them with their auto-update files (`latest.yml`,
# `latest-linux.yml`) to a draft GitHub release. Publishing the draft stays a manual step
# (docs/RELEASE.md).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  # Created once up front, so the parallel builds upload to the same draft instead of racing to
  # create one each
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
          fi

  build:
    needs: draft
    strategy:
      # One platform failing must not cancel the other's upload
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    env:
      # Builds aren't code-signed
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript type check
        run: bun run typecheck

      - name: Build renderer and main bundles
        run: bunx vite build

      - name: Package and upload to the draft release
        run: bunx electron-builder ${{ matrix.platform }} --publish always
